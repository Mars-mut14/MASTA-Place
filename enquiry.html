<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MASTA's Place | Enquiry</title>

    <meta name="description"
        content="Make an accommodation enquiry at MASTA's Place. Check room options, dates, guests and special requests.">

    <meta name="keywords"
        content="MASTA's Place, accommodation enquiry, hotel enquiry, rooms, South Africa">

    <meta name="author" content="MASTA's Place">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <img src="images/logo.png"
             alt="MASTA's Place Logo"
             class="logo">

        <h1>MASTA's Place</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="rooms.html">Our Rooms</a>
            <a href="gallery.html">Gallery</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below to enquire about accommodation
                at MASTA's Place.
            </p>

            <form id="enquiryForm" novalidate>

                <label for="fullName">Full Name:</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                    minlength="2"
                    placeholder="Enter your full name">

                <small class="error" id="fullNameError"></small>


                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email address">

                <small class="error" id="emailError"></small>


                <label for="phone">Phone Number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    pattern="[0-9+ ()-]{7,20}"
                    placeholder="Enter your phone number">

                <small class="error" id="phoneError"></small>


                <label for="room">Room Type:</label>

                <select id="room" name="room" required>

                    <option value="">-- Select a room --</option>

                    <option value="Standard Room">
                        Standard Room - R800 per night
                    </option>

                    <option value="Deluxe Room">
                        Deluxe Room - R1,000 per night
                    </option>

                    <option value="Family Room">
                        Family Room - R1,500 per night
                    </option>

                </select>

                <small class="error" id="roomError"></small>


                <label for="checkIn">Check-in Date:</label>

                <input
                    type="date"
                    id="checkIn"
                    name="checkIn"
                    required>

                <small class="error" id="checkInError"></small>


                <label for="checkOut">Check-out Date:</label>

                <input
                    type="date"
                    id="checkOut"
                    name="checkOut"
                    required>

                <small class="error" id="checkOutError"></small>


                <label for="guests">Number of Guests:</label>

                <input
                    type="number"
                    id="guests"
                    name="guests"
                    min="1"
                    max="10"
                    required
                    placeholder="Number of guests">

                <small class="error" id="guestsError"></small>


                <label for="message">Special Request:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    minlength="10"
                    required
                    placeholder="Enter any special requests"></textarea>

                <small class="error" id="messageError"></small>


                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

            <div id="enquiryResponse" class="response"></div>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 MASTA's Place. All Rights Reserved.
        </p>

    </footer>

    <script src="js/script.js"></script>

</body>
</html>
